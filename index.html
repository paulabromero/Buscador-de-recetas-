<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buscador de Recetas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <style>
    body {
      background-color: #1d1f21;
      color: white;
    }
    header, footer {
      text-align: center;
      padding: 2rem;
      background-color: #121314;
    }
    #resultados {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      width: 18rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🥗 Buscador de Recetas</h1>
    <div class="input-group my-4 w-75 mx-auto">
      <input id="busqueda" type="text" class="form-control" placeholder="Ej: chicken, garlic, etc.">
      <button id="btnBuscar" class="btn btn-success">Buscar</button>
    </div>
  </header>

  <main>
    <h2 class="text-center">🍽️ Recetas Disponibles</h2>
    <div id="resultados"></div>
  </main>

  <footer>
    © 2025 Gourmet Go | Buscador de Recetas
  </footer>

  <script src="./assets/js/app.js"></script>
</body>
</html>
